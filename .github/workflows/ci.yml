name: CI

on:
  push:
    branches: [main]
    paths: ["**.sh", "**.ps1", "**.cmd", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["**.sh", "**.ps1", "**.cmd", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      KEYFILE: /var/lib/rustdesk/id_ed25519
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          shellcheck -x install.sh update.sh uninstall.sh deploy.sh lib/common.sh
          pwsh -NoProfile -Command '$e = $null; [void][Management.Automation.Language.Parser]::ParseFile("$PWD/deploy.ps1", [ref]$null, [ref]$e); if ($e) { $e; exit 1 }'

      - name: SSH-Zugang auf localhost (Ziel für deploy.sh)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          mkdir -p -m 700 ~/.ssh && ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          sudo install -d -m 700 /root/.ssh && sudo tee -a /root/.ssh/authorized_keys < ~/.ssh/id_ed25519.pub > /dev/null
          echo 'AcceptEnv GITHUB_TOKEN' | sudo tee /etc/ssh/sshd_config.d/ci.conf > /dev/null
          printf 'Host 127.0.0.1\n  SendEnv GITHUB_TOKEN\n' >> ~/.ssh/config
          sudo systemctl restart ssh

      - name: Neuinstallation per deploy.sh
        run: |
          ./deploy.sh 127.0.0.1 --yes --no-firewall
          systemctl is-active rustdesk-hbbs rustdesk-hbbr
          if ls -d /tmp/bz-rustdesk-deploy.* 2>/dev/null; then exit 1; fi
          echo "KEY=$(sudo sha256sum "$KEYFILE" | cut -c1-64)" >> "$GITHUB_ENV"

      - name: v1-Installation per deploy.sh migrieren (Schlüssel bleibt erhalten)
        run: |
          # v1-Struktur nachbilden: Daten in /opt/rustdesk, Verzeichnis gehört dem Dienst
          sudo systemctl stop rustdesk-hbbs rustdesk-hbbr
          sudo sh -c 'mv /var/lib/rustdesk/* /opt/rustdesk/ && chown -R rustdesk:rustdesk /opt/rustdesk'
          sudo sed -i -e 's|^WorkingDirectory=.*|WorkingDirectory=/opt/rustdesk\nReadWritePaths=/opt/rustdesk|' \
            -e '/^StateDirectory/d' -e 's| -k _||' /etc/systemd/system/rustdesk-hbb?.service
          sudo systemctl daemon-reload
          sudo systemctl start rustdesk-hbbs rustdesk-hbbr

          ./deploy.sh 127.0.0.1 --yes --no-firewall
          test "$(sudo sha256sum "$KEYFILE" | cut -c1-64)" = "$KEY"
          sudo test ! -e /opt/rustdesk/id_ed25519
          test "$(stat -c %U /opt/rustdesk)" = root

      - name: Reparatur-Update und Deinstallation
        run: |
          sudo -E bash /opt/rustdesk/update.sh --yes --force --no-self-update
          test "$(sudo sha256sum "$KEYFILE" | cut -c1-64)" = "$KEY"
          systemctl is-active rustdesk-hbbs rustdesk-hbbr
          sudo bash /opt/rustdesk/uninstall.sh --yes
          test ! -e /opt/rustdesk
          if id rustdesk 2>/dev/null; then exit 1; fi

      - name: Diagnose
        if: failure()
        run: |
          sudo journalctl -u rustdesk-hbbs -u rustdesk-hbbr -u ssh --no-pager -n 60 || true
          sudo cat /var/log/rustdesk-setup.log || true
